name: repo-checks

# Fails when a source file lacks the copyright and SPDX header, when a secret
# or credential is committed, or when a file contains an absolute local path.
# The checker's own self-test runs first, then the repository checks, then
# gitleaks scans the full git history for secrets. The same checker runs
# locally: python tools/check_repo.py (and --self-test for its fixtures).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No submodules: external/ is excluded from the checks.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Checker self-test
        run: python3 tools/check_repo.py --self-test

      - name: Repository checks
        run: python3 tools/check_repo.py

      # Official gitleaks release binary, pinned by version and by the sha256
      # from gitleaks_<version>_checksums.txt of that release. The
      # gitleaks-action is not used (its license). To bump gitleaks, update
      # GITLEAKS_VERSION and GITLEAKS_SHA256 together.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "$GITHUB_PATH"
          rm "${archive}"

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --no-banner --redact
